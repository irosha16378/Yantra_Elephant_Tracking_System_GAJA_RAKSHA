; PlatformIO Project Configuration File for GajaRaksha ESP32 Firmware
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
description = GajaRaksha IoT Elephant Detection & Alert Firmware for ESP32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Options
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder

; Build Flags
build_flags = 
    -D CORE_DEBUG_LEVEL=2
